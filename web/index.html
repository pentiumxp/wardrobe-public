<!doctype html>

  <meta charset="utf-8">

  <title>男装衣橱</title>
  <script>
    (function () {
      var key = "wardrobeTheme";
      var allowed = { system: true, dark: true, light: true };
      var pluginThemes = { dark: true, light: true };
      var fontSizes = { small: true, default: true, large: true, xlarge: true, xxlarge: true };
      var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      function queryValue(name) {
        try {
          return new URLSearchParams(window.location.search).get(name) || "";
        } catch (error) {
          return "";
        }
      }
      function read() {
        var pluginTheme = queryValue("pluginTheme");
        if (pluginThemes[pluginTheme]) return pluginTheme;
        if (isHermesEmbed()) return parentEffectiveTheme() || "light";
        try {
          var value = window.localStorage.getItem(key) || "system";
          return allowed[value] ? value : "system";
        } catch (error) {
          return "system";
        }
      }
      function isHermesEmbed() {
        return queryValue("embed") === "hermes";
      }
      function parentEffectiveTheme() {
        if (!isHermesEmbed() || window.parent === window) return "";
        try {
          var parentRoot = window.parent.document && window.parent.document.documentElement;
          if (!parentRoot) return "";
          var value = parentRoot.getAttribute("data-effective-theme")
            || parentRoot.getAttribute("data-theme")
            || parentRoot.getAttribute("data-plugin-theme")
            || "";
          return value === "dark" || value === "light" ? value : "";
        } catch (error) {
          return "";
        }
      }
      function effectiveTheme(value) {
        var selected = allowed[value] ? value : read();
        var inherited = parentEffectiveTheme();
        if (inherited) return inherited;
        if (selected === "system") {
          return darkQuery && darkQuery.matches ? "dark" : "light";
        }
        return selected;
      }
      function writeMeta(name, content) {
        var node = document.querySelector('meta[name="' + name + '"]');
        if (!node) {
          node = document.createElement("meta");
          node.setAttribute("name", name);
          document.head.appendChild(node);
        }
        node.setAttribute("content", content);
      }
      function apply(value) {
        var selected = allowed[value] ? value : read();
        var effective = effectiveTheme(selected);
        document.documentElement.setAttribute("data-theme", selected);
        document.documentElement.setAttribute("data-effective-theme", effective);
        var pluginFontSize = queryValue("pluginFontSize");
        document.documentElement.setAttribute("data-font-size", fontSizes[pluginFontSize] ? pluginFontSize : "default");
        writeMeta("theme-color", effective === "dark" ? "#111417" : "#f3efe7");
        writeMeta("apple-mobile-web-app-status-bar-style", effective === "dark" ? "black-translucent" : "default");
      }
      window.wardrobeTheme = { read: read, apply: apply };
      apply(read());
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

                  <button type="button" class="inventory-filter-tab" data-filter-tab="owner">Owner</button>
